services:
  api:
    build: .
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/shipnow
      PORT: 8080
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
