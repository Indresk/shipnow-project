paths:
  /api/mocks/mockingusers:
    get:
      summary: Genera usuarios mock (no guarda)
      tags:
        - Mocks
      parameters:
        - name: users
          in: query
          required: true
          description: Cantidad de mock que se deben generar
          schema:
            type: integer
            minimum: 1
            example: 5
      responses:
        '200':
          description: Lista de usuarios generados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: Cantidad inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Genera e inserta usuarios mock en DB
      tags:
        - Mocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: integer
              required: [users]
              example:
                users: 5
      responses:
        '201':
          description: Usuarios insertados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: Cantidad inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error generando mocks (p.ej. falta data en DB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

