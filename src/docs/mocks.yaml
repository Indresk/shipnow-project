  /api/mocks/generateData:
    get:
      summary: Genera múltiples tipos de mocks según body (no guarda)
      tags:
        - Mocks
      parameters:
        - name: users
          in: query
          required: false
          description: Cantidad de users mock que se deben generar
          schema:
            type: integer
            minimum: 1
            example: 5
        - name: products
          in: query
          required: false
          description: Cantidad de products mock que se deben generar
          schema:
            type: integer
            minimum: 1
            example: 5
        - name: orders
          in: query
          required: false
          description: Cantidad de orders mock que se deben generar
          schema:
            type: integer
            minimum: 1
            example: 5
        - name: deliveries
          in: query
          required: false
          description: Cantidad de deliveries mock que se deben generar
          schema:
            type: integer
            minimum: 1
            example: 5
        - name: couriers
          in: query
          required: false
          description: Cantidad de couriers mock que se deben generar
          schema:
            type: integer
            minimum: 1
            example: 5
      responses:
        '200':
          description: Objetos generados por tipo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Cantidad inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error generando mocks (p.ej. falta data en DB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Genera e inserta múltiples mocks en DB según body
      tags:
        - Mocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: integer
                products:
                  type: integer
                orders:
                  type: integer
                deliveries:
                  type: integer
                couriers:
                  type: integer
              example:
                users: 5
                products: 10
                orders: 5
      responses:
        '201':
          description: Objetos insertados en DB por tipo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Cantidad inválida
